<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Speech Recorder</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #121212;
        color: #eee;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        padding: 1rem;
        text-align: center;
      }
      button {
        background: #1db954;
        border: none;
        color: white;
        padding: 1rem 2rem;
        font-size: 1.25rem;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        box-shadow: 0 4px 12px rgba(29, 185, 84, 0.6);
        user-select: none;
        margin-top: 1.5rem;
        min-width: 200px;
      }
      button.recording {
        background: #e0245e;
        box-shadow: 0 4px 12px rgba(224, 36, 94, 0.6);
      }
      button:disabled {
        background: #555;
        cursor: not-allowed;
        box-shadow: none;
      }
      #status {
        margin-top: 1rem;
        font-size: 1.1rem;
        font-weight: 600;
        min-height: 1.5em;
      }
      #transcript {
        white-space: pre-wrap;
        font-size: 1.1rem;
        max-width: 600px;
        width: 90vw;
        min-height: 3em;
        color: #1db954;
        font-weight: 600;
      }
      #error {
        margin-top: 0.8rem;
        color: #ff4c61;
        font-weight: 700;
        min-height: 1.2em;
      }
    </style>
  </head>
  <body>
    <div id="transcript"></div>
    <button id="recordBtn">Start Recording 🎤</button>
    <div id="error"></div>

    <!-- File Upload Fallback -->
    <div id="fileUpload" style="display: none; margin-top: 2rem">
      <h3>Upload Audio File</h3>
      <input
        type="file"
        id="audioFile"
        accept="audio/*"
        style="
          margin: 1rem;
          padding: 0.5rem;
          border-radius: 5px;
          border: 1px solid #555;
          background: #333;
          color: #eee;
        "
      />
      <button id="uploadBtn" style="background: #f39c12; margin-left: 1rem">
        Upload & Transcribe 📁
      </button>
    </div>

    <script>
      let mediaRecorder
      let audioChunks = []
      let isRecording = false

      const recordBtn = document.getElementById("recordBtn")
      const transcriptDiv = document.getElementById("transcript")
      const errorDiv = document.getElementById("error")
      const fileUploadDiv = document.getElementById("fileUpload")
      const audioFileInput = document.getElementById("audioFile")
      const uploadBtn = document.getElementById("uploadBtn")

      // Check browser compatibility on page load
      window.addEventListener('load', () => {
        console.log("Page loaded, checking browser compatibility...")
        
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          console.error("getUserMedia not supported")
          errorDiv.innerHTML = `
            <strong>Your browser doesn't support microphone access!</strong><br>
            Please use Chrome, Firefox, Safari, or Edge.<br>
            <strong>Alternative:</strong> Use file upload below.
          `
          showFileUpload()
          recordBtn.disabled = true
        } else {
          console.log("getUserMedia is supported!")
          errorDiv.textContent = "Click 'Start Recording' to begin"
        }
      })

      // File upload functionality
      uploadBtn.onclick = async () => {
        const file = audioFileInput.files[0]
        if (!file) {
          errorDiv.textContent = "Please select an audio file first."
          return
        }

        errorDiv.textContent = ""
        transcriptDiv.textContent = "Processing audio file..."
        uploadBtn.disabled = true
        uploadBtn.textContent = "Processing..."

        await sendAudio(file)

        uploadBtn.disabled = false
        uploadBtn.textContent = "Upload & Transcribe 📁"
      }

      function showFileUpload() {
        fileUploadDiv.style.display = "block"
      }

      recordBtn.onclick = async () => {
        errorDiv.textContent = ""
        if (!isRecording) {
          // Start recording
          try {
            console.log("Requesting microphone access...")
            
            // Simple, working getUserMedia request
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: true
            })
            
            console.log("Microphone access granted!")
            
            mediaRecorder = new MediaRecorder(stream)
            audioChunks = []

            mediaRecorder.ondataavailable = (e) => {
              if (e.data.size > 0) audioChunks.push(e.data)
            }

            mediaRecorder.onstop = async () => {
              console.log("Recording stopped, processing audio...")
              const audioBlob = new Blob(audioChunks, { type: "audio/webm" })
              await sendAudio(audioBlob)
              stream.getTracks().forEach((track) => track.stop())
            }

            mediaRecorder.start()
            isRecording = true
            recordBtn.textContent = "Stop Recording ⏹️"
            recordBtn.classList.add("recording")
            transcriptDiv.textContent = "Recording... Speak now!"
            
          } catch (err) {
            console.error("Error accessing microphone:", err)
            errorDiv.textContent = `Microphone error: ${err.message}`
            
            // Show specific error solutions
            if (err.name === 'NotAllowedError') {
              errorDiv.innerHTML = `
                <strong>Microphone permission denied!</strong><br>
                Click the 🔒 icon in your browser's address bar and allow microphone access.
              `
            } else if (err.name === 'NotFoundError') {
              errorDiv.innerHTML = `
                <strong>No microphone found!</strong><br>
                Please connect a microphone and refresh the page.
              `
            } else {
              errorDiv.innerHTML = `
                <strong>Error: ${err.message}</strong><br>
                Try refreshing the page or use a different browser.
              `
            }
          }
        } else {
          // Stop recording
          console.log("Stopping recording...")
          mediaRecorder.stop()
          isRecording = false
          recordBtn.textContent = "Start Recording 🎤"
          recordBtn.classList.remove("recording")
          transcriptDiv.textContent = "Processing..."
        }
      }

      async function sendAudio(audioData) {
        const formData = new FormData()

        // Handle both Blob (from recording) and File (from upload)
        if (audioData instanceof Blob) {
          formData.append("audio", audioData, "audio.webm")
        } else {
          formData.append("audio", audioData)
        }

        try {
          transcriptDiv.textContent = "Transcribing..."

          const response = await fetch("/transcribe", {
            method: "POST",
            body: formData,
          })

          if (!response.ok) {
            const errorData = await response.json()
            throw new Error(errorData.error || "Unknown error")
          }

          const data = await response.json()
          transcriptDiv.textContent = `${data.transcript}`
        } catch (err) {
          errorDiv.textContent = `Error: ${err.message}`
          transcriptDiv.textContent = ""
        }
      }
    </script>
  </body>
</html>
