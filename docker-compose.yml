version: "3.8"

services:
  lingua-speech:
    image: lingua-speech-dev
    container_name: lingua-speech-dev
    ports:
      - "8080:8080"
    volumes:
      # Data directories (always mounted)
      # - ./output:/app/output
      # - ./logs:/app/logs
      # - ./uploads:/app/uploads
      # - ./commonvoice:/app/commonvoice
      # Source code directories (for development - comment out for production)
      - ./src:/app/src
      - ./inference:/app/inference
      - ./tools:/app/tools
      - ./config.py:/app/config.py
    environment:
      - POST_PROCESS_WITH_AI=false
      - PYTHONPATH=/app
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - GENAI_API_KEY=${GENAI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Full training pipeline (preprocessing + training)
  training:
    build: .
    container_name: speech-training
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./commonvoice:/app/commonvoice
      - ./src:/app/src
      - ./inference:/app/inference
      - ./tools:/app/tools
      - ./config.py:/app/config.py
      - ./main.py:/app/main.py
    environment:
      - PYTHONPATH=/app
      - GENAI_API_KEY=${GENAI_API_KEY}
    command: ["python", "main.py"] # Runs both preprocess() and train.main()
    profiles:
      - training

  # Preprocessing only service
  preprocess:
    build: .
    tty: true
    stdin_open: true
    container_name: speech-preprocess
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
      - ./commonvoice:/app/commonvoice
      - ./src:/app/src
      - ./inference:/app/inference
      - ./tools:/app/tools
      - ./config.py:/app/config.py
    environment:
      - PYTHONPATH=/app
      - GENAI_API_KEY=${GENAI_API_KEY}
    command:
      ["python", "-c", "from src.preprocess import preprocess; preprocess()"]
    profiles:
      - preprocess
